[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codekg"
version = "0.1.0"
description = "Graf pengetahuan lokal untuk proyek Python"
requires-python = ">=3.10"
dependencies = ["rdflib>=7.1,<8", "pathspec>=0.12,<1"]

[project.scripts]
codekg = "codekg.cli:main"

[tool.setuptools]
packages = ["codekg"]

[tool.setuptools.package-data]
codekg = ["viewer.html"]
